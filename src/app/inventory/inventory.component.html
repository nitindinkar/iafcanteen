<div class="container-fluid">
    <div class="px-xl-5 py-5">
        <div class="add-product">
            <h2>All Products</h2>
              <div class="inventory">
                <div class="filters">
                    <form action="post">
                        <div class="row">
                          <!-- <div class="mb-3 mt-3 col-md-2 px-2">
                            <select class="form-control" id="action">
                            <option>Action</option>
                            <option>Edit</option>
                            </select>
                          </div> -->
                          <div class="mb-3 mt-3 col-md-2 px-2">
                            <select class="form-control" id="action" (change)="handleEditAction()" >
                              <option>Action</option>
                              <option>Edit</option>
                            </select>
                          </div>
                          <div class="mt-3 col-md-1 px-2">
                            <button type="button" class="btn btn-primary mb-3 form-filter" (click)="handleApply()">Apply</button>
                          </div>
                          <!-- <div class="mt-3 col-md-1 px-2">
                            <button type="submit" class="btn btn-primary mb-3 form-filter">Apply</button>
                        </div> -->
                        <!-- <div class="mb-3 mt-3 col-md-3 px-2">
                          <select class="form-control" id="Category" [(ngModel)]="selectedCategory" (change)="filterProductsByCategory()">
                            <option value="Filter By Category">Filter By Category</option>
                            <option *ngFor="let category of categories" [ngValue]="category.name">{{ category.name }}</option>
                          </select>
                        </div>
                        
                          <div class="mb-3 mt-3 col-md-3 px-2">
                            <select class="form-control" id="status">
                            <option>Filter By Stock Status</option>
                            <option>In Stock</option>
                            <option>Out of Stock</option>
                            </select>
                          </div> -->

                          <div class="mb-3 mt-3 col-md-3 px-2">
                            <select class="form-control" id="Category" [(ngModel)]="selectedCategory" [ngModelOptions]="{standalone: true}" (change)="filterProductsByCategory()">
                                <option value="Filter By Category">Filter By Category</option>
                                <option *ngFor="let category of categories" [ngValue]="category.name">{{ category.name }}</option>
                            </select>
                        </div>
                        
                        <div class="mb-3 mt-3 col-md-3 px-2">
                            <select class="form-control" id="status" [(ngModel)]="selectedStockStatus"  [ngModelOptions]="{standalone: true}" (change)="filterProductsByStockStatus()">
                                <option value="Filter By Stock Status">Filter By Stock Status</option>
                                <option>In Stock</option>
                                <option>Out of Stock</option>
                            </select>
                        </div>
                        
                          <div class="mt-3 col-md-3 px-2">
                              <button type="submit" class="btn btn-primary mb-3 form-filter" (click)="applyFilters()">Filter</button>
                              <span> Total Products : {{productCount}}</span>
                          </div>
                          </div>
                        </form>
                </div>
                <div class="row overflow-auto">
              <table class="table table-striped">
                <thead>
                  <tr >
                    <th scope="col"><input type="checkbox" name="selectAll" id="selectAll"></th>
                    <th scope="col">Images</th>
                    <th scope="col">Name</th>
                    <th scope="col">Category</th>
                    <th scope="col">Total Stock</th>
                    <th scope="col">Stock Status</th>
                    <th scope="col">Price</th>
                  </tr>
                </thead>
                <tbody>
                  <tr *ngFor="let product of filteredProducts">
                    <th scope="row"><input type="checkbox" name="selectAll" id="selectAll" [checked]="isSelected(product)"(change)="toggleSelectProduct($event, product)" ></th>
                    <td><img  [src]="product.imageUrl" class="inventory-image"></td>
                    <td>{{ product.productName }}</td>
                    <td>{{ product.category.name }}</td>
                    <td>
                      <span *ngIf="!editingMode">{{ product.availableStock }}</span>
                      <input type="number" *ngIf="editingMode && selectedProducts.includes(product)" [(ngModel)]="product.availableStock">
                    </td>
                   
                    <!-- <td>{{ product.availableStock}}</td> -->
                    
                      <td>
                        <span class="wishlist-in-stock" *ngIf="product.availableStock !== null && product.availableStock > 0">In Stock</span>
                        <span class="wishlist-out-of-stock"  *ngIf="product.availableStock === 0 || product.availableStock === null">Out of Stock</span>
                      </td>
                    
                    <td>₹{{ product.productDiscountedPrice }} <span class="mrp">(₹{{ product.productActualPrice }})</span></td>
                  </tr>
                             
                    
                </tbody>
              </table>

            </div>
        </div>
    </div>

</div>
