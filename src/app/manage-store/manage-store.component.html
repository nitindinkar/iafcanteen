<div class="container-fluid">
  <div class="px-xl-5 py-5">
    <div class="add-product">
      <h2>Manage Stores</h2>
      <div class="inventory">
        <div class="add-admin px-4 my-4">
          <h3 class="seconder-heading mt-4">Add Stores</h3>
          <form action="post">
            <div class="row">
              <!-- <div class="col-md-4 mb-3 mt-3">
                                <label for="store" class="form-label">Store Id:</label>
                                <input type="text" class="form-control"  [(ngModel)]="id" placeholder="Enter Store Id" name="id">
                              </div> -->

              <div class="col-md-4 mb-3 mt-3">
                <label for="service" class="form-label">Store Name:</label>
                <input type="text" class="form-control" [(ngModel)]="name" placeholder="Enter Number" name="name">
              </div>

              <div class="col-md-4 mb-3 mt-3">
                <label for="contact" class="form-label">Store Contact Number:</label>
                <input type="text" class="form-control" [(ngModel)]="contact" placeholder="Enter Contact Number"
                  name="contact">
              </div>

              <!-- <div class="col-md-4 mb-3 mt-3">
                            <label for="contact" class="form-label">Store Address</label>
                            <input type="text" class="form-control"  [(ngModel)]="address"  placeholder="Store Address " name="address">
                          </div> -->
              <div class="col-md-4 mb-3 mt-3">
                <label for="contact" class="form-label">Store Address</label>
                <textarea class="form-control custom-textarea" id="address" [(ngModel)]="address"
                  placeholder="Store Address " name="address" rows="3"></textarea>
              </div>
              <!-- <div class="col-md-4 mb-3 mt-3"> 
                            <label for="contact" class="form-label">Store Admin Id </label>
                            <input type="text" class="form-control"   [(ngModel)]="admin" placeholder="Enter Admin Id " name="CdNum">
                          </div> -->

              <!-- <div class="col-md-4 mb-3 mt-3">
                            <label for="contact" class="form-label">Store Admin Id </label>
                            <input type="text" class="form-control" [(ngModel)]="admin" placeholder="Enter Admin Id" name="CdNum" (focus)="getDeactiveAdmins()">
                            <ul  class="list-group mt-2">
                              <li class="list-group-item" *ngFor="let deactiveAdmin of deactiveAdmins">{{ deactiveAdmin.id }}</li>
                            </ul>
                          </div> -->

              <div class="col-md-4 mb-3 mt-3">
                <label for="service" class="form-label">Store Admin Id</label>
                <select class="form-control" id="Category" [(ngModel)]="selectedAdminId"
                  [ngModelOptions]="{standalone: true}">
                  <option *ngFor="let admin of allAdmins " [ngValue]="admin.id">{{admin.id}}</option>
                </select>
              </div>



              <div class="col-md-12 mb-3 mt-3" *ngIf="!edit">
                <button type="submit" class="btn btn-primary mb-3" (click)="addStore()">Submit</button>
              </div>
              <div class="col-md-12 mb-3 mt-3" *ngIf="edit">
                <button type="submit" class="btn btn-primary mb-3" (click)="updateStore()">update</button>
              </div>

            </div>
          </form>
        </div>
        <div class="add-admin px-4 my-4">
          <div class="filters mt-3">
            <form action="post">
              <div class="row">
                <!-- <div class="mb-3 mt-3 col-md-2 px-2">
                            <select class="form-control" id="action">
                            <option>Bulk Action</option>
                            <option>Delete</option>
                            </select>
                          </div> -->
                <!-- <div class="mt-3 col-md-1 px-2">
                            <button type="submit" class="btn btn-primary mb-3 form-filter">Apply</button>
                        </div> -->

                <!-- <div class="mb-3 mt-3 col-md-5 px-4">
                            <select class="form-control" id="status">
                            <option>Filter By Admin Status</option>
                            <option>Active</option>
                            <option>Deactive</option>
                            </select>
                          </div> -->
                <div class="mb-3 mt-3 col-md-5 px-4">
                  <select class="form-control" id="status" [(ngModel)]="selectedStatus"
                    [ngModelOptions]="{standalone: true}">
                    <option value="Filter By Admin Status">Filter By Admin Status</option>
                    <option value="Active">Active</option>
                    <option value="Deactive">Deactive</option>
                  </select>
                </div>

                <div class="mt-3 col-md-3 px-3">
                  <button type="submit" class="btn btn-primary mb-3 form-filter"
                    (click)="filterByStore()">Filter</button>
                  <span> Total Stores : {{ filteredStores.length }} </span>
                </div>
              </div>
            </form>
          </div>
          <div class="row overflow-auto">
            <table class="table table-striped">
              <thead>
                <tr>
                  <th scope="col"><input type="checkbox" name="selectAll" id="selectAll"></th>
                  <th scope="col">Store Name</th>
                  <th scope="col">Contact </th>
                  <th scope="col">Store Admin Id</th>
                  <!-- <th scope="col">Store Admin Name</th> -->
                  <th scope="col"> Status</th>
                  <th scope="col">Change Status</th>
                  <th scope="col">Action</th>

                </tr>
              </thead>
              <tbody>
                <tr *ngFor="let store of filteredStores">
                  <th scope="row"><input type="checkbox" name="selectAll" id="selectAll"></th>
                  <td>{{store.name}}</td>
                  <td>{{store.contact}}</td>
                  <td>{{store.admin.id}}</td>
                  <!-- <td>{{store.admin.name}}</td> -->
                  <td>{{ store.active ? 'Active' : 'Inactive' }}</td>
                  <td>
                    <button type="button" class="btn btn-success mr-2" (click)=" activateStore(store.id)">
                      <i class="fas fa-check"></i> Activate
                    </button>

                    <button type="button" class="btn btn-danger" (click)="deactivateStore(store.id)">
                      <i class="fas fa-times"></i> Deactivate
                    </button>
                  </td>
                  <td>
                    <button type="submit" class="btn btn-secondary" (click)="editStore(store,store.id)"><i
                        class="fa fa-edit"></i></button>
                    <button type="submit" class="btn btn-secondary ml-2" (click)="deleteStore(store.id)"><i
                        class="fa fa-trash"></i></button>

                  </td>
                </tr>

              </tbody>
            </table>

          </div>
        </div>
      </div>
    </div>

  </div>
