<h2 class="custom-dialog-title" mat-dialog-title>Add Stock</h2>
<div class="custom-dialog-content">
  <p class="current-stock">Current Stock: {{ currentStock }}</p>
  <mat-form-field appearance="fill">
    <mat-label>New Stock</mat-label>
    <input matInput type="number" [(ngModel)]="newStockValue" placeholder="Add New Stock">
  </mat-form-field>
</div>
<div class="custom-dialog-actions" mat-dialog-actions>
  <button mat-button class="custom-dialog-cancel" (click)="closeDialog()">Cancel</button>
  <button mat-button class="custom-dialog-confirm" color="primary" [disabled]="newStockValue <= 0" (click)="confirmAddStock()">Add Stock</button>
</div>
