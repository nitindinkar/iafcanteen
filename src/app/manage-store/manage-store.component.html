<div class="container-fluid">
    <div class="px-xl-5 py-5">
        <div class="add-product">
            <h2>Manage Stores</h2>
              <div class="inventory">
                <div class="add-admin px-4 my-4">
                  <h3 class="seconder-heading mt-4">Add Stores</h3>
                   <form action="post">
                        <div class="row">
                            <div class="col-md-4 mb-3 mt-3">
                                <label for="store" class="form-label">Store Id:</label>
                                <input type="text" class="form-control"  [(ngModel)]="id" placeholder="Enter Store Id" name="CdNum">
                              </div>
                          
                          <div class="col-md-4 mb-3 mt-3">
                            <label for="service" class="form-label">Store Name:</label>
                            <input type="text" class="form-control"  [(ngModel)]="name"  placeholder="Enter Number" name="CdNum">
                          </div>
                          
                          <div class="col-md-4 mb-3 mt-3">
                            <label for="contact" class="form-label">Store Contact Number:</label>
                            <input type="text" class="form-control"  [(ngModel)]="contact" placeholder="Enter Contact Number" name="CdNum">
                          </div>

                          <div class="col-md-4 mb-3 mt-3">
                            <label for="contact" class="form-label">Store Address</label>
                            <input type="text" class="form-control"  [(ngModel)]="address"  placeholder="Store Address " name="CdNum">
                          </div>
                          <div class="col-md-4 mb-3 mt-3"> 
                            <label for="contact" class="form-label">Store Admin Id </label>
                            <input type="text" class="form-control"   [(ngModel)]="admin" placeholder="Enter Admin Id " name="CdNum">
                          </div>
                          
                          <div class="col-md-12 mb-3 mt-3">
                            <button type="submit" class="btn btn-primary mb-3" (click)="addStore()">Submit</button>
                          </div>

                        </div>
                   </form> 
                </div>
              <div class="add-admin px-4 my-4">
                <div class="filters mt-3">
                    <form action="post">
                        <div class="row">
                          <div class="mb-3 mt-3 col-md-2 px-2">
                            <select class="form-control" id="action">
                            <option>Bulk Action</option>
                            <option>Delete</option>
                            </select>
                          </div>
                          <div class="mt-3 col-md-1 px-2">
                            <button type="submit" class="btn btn-primary mb-3 form-filter">Apply</button>
                        </div>
                          
                          <div class="mb-3 mt-3 col-md-5 px-4">
                            <select class="form-control" id="status">
                            <option>Filter By Admin Status</option>
                            <option>Active</option>
                            <option>Deactive</option>
                            </select>
                          </div>
                          <div class="mt-3 col-md-3 px-3">
                              <button type="submit" class="btn btn-primary mb-3 form-filter">Filter</button>
                              <span >   Total Stores : 400   </span>
                          </div>
                          </div>
                        </form> 
                </div>
                <div class="row overflow-auto">
              <table class="table table-striped">
                <thead>
                  <tr>
                    <th scope="col"><input type="checkbox" name="selectAll" id="selectAll"></th>
                    <th scope="col">Store Name</th>
                    <th scope="col">Assigned Admin </th>
                    <th scope="col">Status</th>
                    <th scope="col">Action</th>
                    
                  </tr>
                </thead>
                <tbody>
                  <tr>
                    <th scope="row"><input type="checkbox" name="selectAll" id="selectAll"></th>
                    <td>Store Name</td>
                    <td>Assiged Admin </td>
                    <td>Active</td>
                    <td>         
                      <button type="submit" class="btn btn-secondary"><i class="fa fa-edit"></i></button>
                      <button type="submit" class="btn btn-secondary ml-2"><i class="fa fa-trash"></i></button>

                    </td>
                  </tr>
                  <tr>
                    <th scope="row"><input type="checkbox" name="selectAll" id="selectAll"></th>
                    <td>Store Name</td>
                    <td>Assiged Admin </td>
                    <td>Active</td>
                    <td>         
                      <button type="submit" class="btn btn-secondary"><i class="fa fa-edit"></i></button>
                      <button type="submit" class="btn btn-secondary ml-2"><i class="fa fa-trash"></i></button>

                    </td>
                  </tr>
                  <tr>
                    <th scope="row"><input type="checkbox" name="selectAll" id="selectAll"></th>
                    <td>Store Name</td>
                    <td>Assiged Admin </td>
                    <td>Active</td>
                    <td>         
                      <button type="submit" class="btn btn-secondary"><i class="fa fa-edit"></i></button>
                      <button type="submit" class="btn btn-secondary ml-2"><i class="fa fa-trash"></i></button>

                    </td>
                  </tr>
                  <tr>
                    <th scope="row"><input type="checkbox" name="selectAll" id="selectAll"></th>
                    <td>Store Name</td>
                    <td>Assiged Admin </td>
                    <td>Active</td>
                    <td>         
                      <button type="submit" class="btn btn-secondary"><i class="fa fa-edit"></i></button>
                      <button type="submit" class="btn btn-secondary ml-2"><i class="fa fa-trash"></i></button>

                    </td>
                  </tr>
                </tbody>
              </table>
              
                </div>
              </div>
        </div>
    </div>
    
</div>
